name: PathPlanner

on:
  push:
    branches: [main]

  # Feature PRs go into staging without building; the staging -> main release
  # PR runs the checks and builds, and the merge to main publishes the release
  pull_request:
    branches: [main]

  # Versions are automatic (see the version job); a manual run on main re-runs that release
  workflow_dispatch:

env:
  # Match the Flutter used to develop and test the fork (keeps pubspec.lock valid)
  FLUTTER_VERSION: 3.47.8

jobs:
  # Pushes/manual runs on main: <upstream tag>-4003.<commits since that tag>, e.g.
  # 2026.1.2-4003.8, and a GitHub release gets published. Anything else (PRs, other
  # branches) is a 0.0.0-dev-<run> build with no release.
  version:
    name: "[GUI] Compute Version"
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Forks don't get upstream's tags, so fetch its release tags to find our base
            git fetch --quiet --no-tags https://github.com/mjansen4857/pathplanner.git \
              '+refs/tags/v*:refs/tags/v*'
            base=$(git describe --tags --match 'v[0-9]*' --exclude '*-4003.*' --abbrev=0)
            count=$(git rev-list --count "$base"..HEAD)
            echo "version=${base#v}-4003.${count}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  formatting-analysis:
    name: "[GUI] Check Formatting & Analysis"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
          
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-path: ${{ runner.tool_cache }}/flutter/linux
      
      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format -o none --set-exit-if-changed lib/* test/*
      
      - name: Generate mocks
        run: dart run build_runner build
      
      # Newer Flutter flags info-level lints in upstream code (avoid_slow_async_io, a
      # deprecated onReorder); leave those to upstream, still fail on warnings/errors
      - name: Analyze
        run: flutter analyze --no-fatal-infos
  
  test:
    name: "[GUI] Run Tests"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-path: ${{ runner.tool_cache }}/flutter/linux

      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate full coverage test
        run: dart run full_coverage
      
      - name: Generate mocks
        run: dart run build_runner build

      - name: Run tests
        run: flutter test --coverage
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: flutter-coverage
          files: coverage/lcov.info
  
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            build-option: "windows"
            artifact-path: "build/windows/x64/runner/Release"
            artifact-name: PathPlanner-Windows
          - os: macos-15
            build-option: "macos"
            artifact-path: "build/macos/Build/Products/Release/PathPlanner-macOS.zip"
            artifact-name: PathPlanner-macOS
          - os: ubuntu-22.04
            build-option: "linux"
            artifact-path: "build/linux/x64/release/bundle"
            artifact-name: PathPlanner-Linux
    name: "[GUI] Build - ${{ matrix.artifact-name }}"
    needs: [version, formatting-analysis, test]
    runs-on: ${{ matrix.os }}
    env:
      VERSION_NAME: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      
      - name: Install flutter deps
        if: ${{ matrix.build-option == 'linux' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-path: ${{ runner.tool_cache }}/flutter/${{ matrix.build-option }}
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Set pubspec version
        run: |
          flutter pub global activate cider
          dart run cider version "${{ env.VERSION_NAME }}+${{ github.run_number }}"
      
      - name: Build app
        run: flutter build ${{ matrix.build-option }}
      
      - name: Copy redist
        if: ${{ matrix.build-option == 'windows' }}
        run: |
          cp windows/redist/msvcp140.dll build/windows/x64/runner/Release
          cp windows/redist/vcruntime140.dll build/windows/x64/runner/Release
          cp windows/redist/vcruntime140_1.dll build/windows/x64/runner/Release
      
      - name: Zip release (macOS)
        if: ${{ matrix.build-option == 'macos' }}
        run: |
          cd build/macos/Build/Products/Release
          zip -r PathPlanner-macOS.zip PathPlanner.app --symlinks
      
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}
          path: ${{ matrix.artifact-path }}
      
      - name: Create macOS DMG
        if: ${{ matrix.build-option == 'macos' }}
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: build/macos/Build/Products/Release/${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}
          src_dir: build/macos/Build/Products/Release/PathPlanner.app
      
      - name: Upload macOS DMG artifact
        if: ${{ matrix.build-option == 'macos' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-dmg
          path: build/macos/Build/Products/Release/${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}.dmg

      # Artifacts don't keep the executable bit, so ship Linux as a tarball
      - name: Create Linux tarball
        if: ${{ matrix.build-option == 'linux' }}
        run: |
          tar -czf ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}.tar.gz \
            -C build/linux/x64/release --transform 's,^bundle,PathPlanner-4003,' bundle

      - name: Upload Linux tarball artifact
        if: ${{ matrix.build-option == 'linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-tar
          path: ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}.tar.gz

      # Built on the oldest runner (22.04), so it installs on Ubuntu 22.04+ and Debian 12+
      - name: Create Linux deb
        if: ${{ matrix.build-option == 'linux' }}
        run: |
          linux/packaging/build_deb.sh build/linux/x64/release/bundle "${{ env.VERSION_NAME }}" \
            ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-amd64.deb

      - name: Upload Linux deb artifact
        if: ${{ matrix.build-option == 'linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-deb
          path: ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-amd64.deb

      - name: Create windows installer
        if: ${{ matrix.build-option == 'windows' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: windows_installer.iss
          options: /O+ /F"${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-setup"
      
      - name: Upload windows installer artifact
        if: ${{ matrix.build-option == 'windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-setup
          path: build/windows/x64/installer/${{ matrix.artifact-name }}-v${{ env.VERSION_NAME }}-setup.exe
      
  # main only: publish the installers as a GitHub release tagged v<version>
  release:
    name: "[GUI] Publish GitHub Release"
    if: ${{ needs.version.outputs.release == 'true' }}
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-files

      # The staging -> main release PR's description is the changelog; direct pushes
      # and manual runs have no PR and get just the standard text
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '.[0].body // ""' > notes.md
          if [[ -s notes.md ]]; then printf '\n---\n\n' >> notes.md; fi
          cat >> notes.md <<'EOF'
          FRC Team 4003's fork of [PathPlanner](https://github.com/mjansen4857/pathplanner) with a
          per-path "Auto-smooth (min accel)" option that computes every control point as a
          minimum-acceleration spline through the waypoints.

          Installs and runs next to stock PathPlanner with its own settings.

          These builds are not code-signed:
          - Windows: SmartScreen may warn; choose "More info" then "Run anyway".
          - macOS: right-click the app and choose Open the first time.
          - Linux: `sudo apt install ./PathPlanner-Linux-*.deb` (Ubuntu 22.04+, Debian 12+), or
            extract the tarball and run `PathPlanner-4003/pathplanner`.
          EOF
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PathPlanner 4003 v${{ needs.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            release-files/**/*-setup.exe
            release-files/**/*.dmg
            release-files/**/*.tar.gz
            release-files/**/*.deb
